spring.application.name=conge-management


spring.datasource.url=jdbc:postgresql://localhost:5432/conges_management
spring.datasource.username=postgres
spring.datasource.password=Elbay220604

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.protocol=smtp
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true 
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false

spring.ldap.urls=ldap://localhost:389
spring.ldap.base=dc=company,dc=local
spring.ldap.username=cn=admin,dc=company,dc=local
spring.ldap.password=adminLdap

jwt.secret=${JWT_SECRET}

server.port=8080
