databaseChangeLog:

  - changeSet:
      id: baseline
      author: bayrem
      changes:
        - tagDatabase:
            tag: baseline

  - changeSet:
       id: seed-modules
       author: bayrem
       changes:
         - insert :
             tableName: modules
             columns:
               - column:
                   name: name
                   value: USER
               - column:
                   name: description
                   value: user management
         - insert:
             tableName: modules
             columns:
               - column:
                   name: name
                   value : DEPARTMENT
               - column :
                   name: description
                   value: department management

         - insert:
             tableName: modules
             columns:
               - column:
                   name: name
                   value: LEAVE
               - column:
                   name: description
                   value: leave management


  - changeSet:
      id: seed-permissions
      author: bayrem
      changes:

        - insert:
            tableName: permissions
            columns:
              - column:
                  name: name
                  value: USER_CREATE
              - column:
                  name: description
                  value: Create users
              - column:
                  name: module_id
                  valueComputed: "(SELECT id FROM modules WHERE name = 'USER')"

        - insert:
            tableName: permissions
            columns:
              - column:
                  name: name
                  value: USER_READ
              - column:
                  name: description
                  value: Read users
              - column:
                  name: module_id
                  valueComputed: "(SELECT id FROM modules WHERE name = 'USER')"

        - insert:
            tableName: permissions
            columns:
              - column:
                  name: name
                  value: USER_UPDATE
              - column:
                  name: description
                  value: Update users
              - column:
                  name: module_id
                  valueComputed: "(SELECT id FROM modules WHERE name = 'USER')"

        - insert:
            tableName: permissions
            columns:
              - column:
                  name: name
                  value: DEPARTMENT_CREATE
              - column:
                  name: description
                  value: Create departments
              - column:
                  name: module_id
                  valueComputed: "(SELECT id FROM modules WHERE name = 'DEPARTMENT')"

        - insert:
            tableName: permissions
            columns:
              - column:
                  name: name
                  value: DEPARTMENT_READ
              - column:
                  name: description
                  value: Read departments
              - column:
                  name: module_id
                  valueComputed: "(SELECT id FROM modules WHERE name = 'DEPARTMENT')"

        - insert:
            tableName: permissions
            columns:
              - column:
                  name: name
                  value: DEPARTMENT_UPDATE
              - column:
                  name: description
                  value: Update departments
              - column:
                  name: module_id
                  valueComputed: "(SELECT id FROM modules WHERE name = 'DEPARTMENT')"


        - insert:
            tableName: permissions
            columns:
              - column:
                  name: name
                  value: LEAVE_CREATE
              - column:
                  name: description
                  value: Create leave requests
              - column:
                  name: module_id
                  valueComputed: "(SELECT id FROM modules WHERE name = 'LEAVE')"

        - insert:
            tableName: permissions
            columns:
              - column:
                  name: name
                  value: LEAVE_READ_OWN
              - column:
                  name: description
                  value: Read own leave requests
              - column:
                  name: module_id
                  valueComputed: "(SELECT id FROM modules WHERE name = 'LEAVE')"

        - insert:
            tableName: permissions
            columns:
              - column:
                  name: name
                  value: LEAVE_CANCEL_OWN
              - column:
                  name: description
                  value: Cancel own leave requests
              - column:
                  name: module_id
                  valueComputed: "(SELECT id FROM modules WHERE name = 'LEAVE')"

        - insert:
            tableName: permissions
            columns:
              - column:
                  name: name
                  value: LEAVE_READ_TEAM
              - column:
                  name: description
                  value: Read team leave requests
              - column:
                  name: module_id
                  valueComputed: "(SELECT id FROM modules WHERE name = 'LEAVE')"

        - insert:
            tableName: permissions
            columns:
              - column:
                  name: name
                  value: LEAVE_APPROVE
              - column:
                  name: description
                  value: Approve leave requests
              - column:
                  name: module_id
                  valueComputed: "(SELECT id FROM modules WHERE name = 'LEAVE')"

        - insert:
            tableName: permissions
            columns:
              - column:
                  name: name
                  value: LEAVE_REJECT
              - column:
                  name: description
                  value: Reject leave requests
              - column:
                  name: module_id
                  valueComputed: "(SELECT id FROM modules WHERE name = 'LEAVE')"

        - insert:
            tableName: permissions
            columns:
              - column:
                  name: name
                  value: LEAVE_READ_ALL
              - column:
                  name: description
                  value: Read all leave requests
              - column:
                  name: module_id
                  valueComputed: "(SELECT id FROM modules WHERE name = 'LEAVE')"

        - insert:
            tableName: permissions
            columns:
              - column:
                  name: name
                  value: LEAVE_MANAGE_ALL
              - column:
                  name: description
                  value: Manage all leave requests
              - column:
                  name: module_id
                  valueComputed: "(SELECT id FROM modules WHERE name = 'LEAVE')"

