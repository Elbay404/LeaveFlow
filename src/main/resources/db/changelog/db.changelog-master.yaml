  - changeSet:
      id: create-notifications-table
      author: bayrem
      changes:

        - createTable:
            tableName: notifications
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: recipient_id
