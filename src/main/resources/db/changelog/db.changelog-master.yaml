  - changeSet:
      id: create-leaves-table
      author: bayrem
      changes:
        - createTable:
            tableName: leaves
            columns:

              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: leave_type_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: start_date
                  type: date
                  constraints:
                    nullable: false

              - column:
                  name: end_date
                  type: date
                  constraints:
                    nullable: false

              - column:
                  name: duration
                  type: int
                  constraints:
                    nullable: false

              - column:
                  name: reason
                  type: varchar(1000)

              - column:
                  name: requested_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false

              - column:
                  name: approved_by
                  type: bigint

              - column:
                  name: approved_at
                  type: timestamp

              - column:
                  name: rejection_reason
                  type: varchar(1000)

              - column:
                  name: document_name
                  type: varchar(255)

              - column:
                  name: document_path
                  type: varchar(500)

        - addForeignKeyConstraint:
            baseTableName: leaves
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_leaves_user

        - addForeignKeyConstraint:
            baseTableName: leaves
            baseColumnNames: leave_type_id
            referencedTableName: leave_types
            referencedColumnNames: id
            constraintName: fk_leaves_leave_type

        - addForeignKeyConstraint:
            baseTableName: leaves
            baseColumnNames: approved_by
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_leaves_approved_by


