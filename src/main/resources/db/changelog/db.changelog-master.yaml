      id: add-manager-to-users
      author: bayrem
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: manager_id
                  type: BIGINT
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: manager_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_users_manager

  - changeSet:
      id: add-ldap-uid-to-users
