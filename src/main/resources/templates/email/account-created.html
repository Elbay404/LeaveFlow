<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your LeaveFlow Account</title>
</head>

<body style="margin:0;padding:0;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#172033;">

<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f7fb;padding:35px 15px;">
    <tr>
        <td align="center">

            <table width="600" cellpadding="0" cellspacing="0" border="0"
                   style="max-width:600px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e5eaf2;">

                <tr>
                    <td style="background:#06122b;padding:28px 35px;text-align:center;">
                        <img src="cid:logo"
                             alt="LeaveFlow"
                             style="width:280px;max-width:80%;height:auto;">
                    </td>
                </tr>

                <tr>
                    <td style="padding:38px 40px;">

                        <p style="margin:0 0 8px;font-size:13px;font-weight:bold;color:#2563eb;">
                            ACCOUNT CREATED
                        </p>

                        <h1 style="margin:0 0 20px;font-size:26px;color:#111827;">
                            Welcome to LeaveFlow
                        </h1>

                        <p style="margin:0 0 24px;font-size:15px;line-height:1.7;color:#64748b;">
                            Hello <strong th:text="${firstName}">Ahmed</strong>,
                            your LeaveFlow account has been created successfully.
                        </p>

                        <table width="100%" cellpadding="0" cellspacing="0"
                               style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:18px;">

                            <tr>
                                <td style="padding:8px 0;color:#64748b;font-size:13px;">
                                    Email
                                </td>
                                <td style="padding:8px 0;text-align:right;font-weight:bold;font-size:13px;color:#172033;"
                                    th:text="${recipientEmail}">
                                    user@example.com
                                </td>
                            </tr>

                            <tr>
                                <td style="padding:8px 0;color:#64748b;font-size:13px;">
                                    Temporary Password
                                </td>
                                <td style="padding:8px 0;text-align:right;font-weight:bold;font-size:13px;color:#172033;"
                                    th:text="${temporaryPassword}">
                                    password
                                </td>
                            </tr>

                            <tr>
                                <td style="padding:8px 0;color:#64748b;font-size:13px;">
                                    Role
                                </td>
                                <td style="padding:8px 0;text-align:right;font-weight:bold;font-size:13px;color:#172033;"
                                    th:text="${role}">
                                    Employee
                                </td>
                            </tr>

                            <tr>
                                <td style="padding:8px 0;color:#64748b;font-size:13px;">
                                    Department
                                </td>
                                <td style="padding:8px 0;text-align:right;font-weight:bold;font-size:13px;color:#172033;"
                                    th:text="${department}">
                                    IT
                                </td>
                            </tr>

                        </table>

                        <div style="margin-top:25px;padding:15px 18px;background:#eff6ff;border-left:4px solid #2563eb;border-radius:8px;">
                            <p style="margin:0;font-size:13px;line-height:1.6;color:#475569;">
                                Please change your temporary password after your first login.
                            </p>
                        </div>

                    </td>
                </tr>

                <tr>
                    <td style="padding:22px 40px;background:#f8fafc;border-top:1px solid #e5e7eb;text-align:center;">
                        <p style="margin:0;font-size:12px;color:#94a3b8;">
                            LeaveFlow · Leave Management
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
