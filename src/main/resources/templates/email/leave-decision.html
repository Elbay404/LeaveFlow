<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Request Decision</title>
</head>

<body style="margin:0;padding:0;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#172033;">

<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f7fb;padding:35px 15px;">
    <tr>
        <td align="center">

            <table width="600" cellpadding="0" cellspacing="0" border="0"
                   style="max-width:600px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e5eaf2;">

                <tr>
                    <td style="background:#06122b;padding:28px 35px;text-align:center;">
                        <img src="cid:logo"
                             alt="LeaveFlow"
                             style="width:280px;max-width:80%;height:auto;">
                    </td>
                </tr>

                <tr>
                    <td style="padding:38px 40px;">

                        <p style="margin:0 0 8px;font-size:13px;font-weight:bold;"
                           th:style="'color:' + (${status == 'APPROVED'} ? '#059669' : '#dc2626')"
                           th:text="${status}">
                            APPROVED
                        </p>

                        <h1 style="margin:0 0 20px;font-size:26px;color:#111827;">
                            Leave request
                            <span th:text="${status.toLowerCase()}">
                                approved
                            </span>
                        </h1>

                        <p style="margin:0 0 25px;font-size:15px;line-height:1.7;color:#64748b;">
                            Hello <strong th:text="${employeeName}">Ahmed</strong>,
                            your leave request has been processed.
                        </p>

                        <table width="100%" cellpadding="0" cellspacing="0"
                               style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:18px;">

                            <tr>
                                <td style="padding:8px 0;color:#64748b;font-size:13px;">
                                    Leave Type
                                </td>
                                <td style="padding:8px 0;text-align:right;font-weight:bold;font-size:13px;color:#172033;"
                                    th:text="${leaveType}">
                                    Annual Leave
                                </td>
                            </tr>

                            <tr>
                                <td style="padding:8px 0;color:#64748b;font-size:13px;">
                                    Start Date
                                </td>
                                <td style="padding:8px 0;text-align:right;font-weight:bold;font-size:13px;color:#172033;"
                                    th:text="${startDate}">
                                    15/10/2026
                                </td>
                            </tr>

                            <tr>
                                <td style="padding:8px 0;color:#64748b;font-size:13px;">
                                    End Date
                                </td>
                                <td style="padding:8px 0;text-align:right;font-weight:bold;font-size:13px;color:#172033;"
                                    th:text="${endDate}">
                                    18/10/2026
                                </td>
                            </tr>

                            <tr>
                                <td style="padding:8px 0;color:#64748b;font-size:13px;">
                                    Duration
                                </td>
                                <td style="padding:8px 0;text-align:right;font-weight:bold;font-size:13px;color:#172033;">
                                    <span th:text="${duration}">4</span> working days
                                </td>
                            </tr>

                            <tr>
                                <td style="padding:8px 0;color:#64748b;font-size:13px;">
                                    Status
                                </td>

                                <td
                                        th:style="'padding:8px 0;text-align:right;font-weight:bold;font-size:13px;color:' + (${status == 'APPROVED'} ? '#059669' : '#dc2626')"
                                        th:text="${status}">
                                    APPROVED
                                </td>
                            </tr>

                            <tr>
                                <td style="padding:8px 0;color:#64748b;font-size:13px;">
                                    Action By
                                </td>

                                <td style="padding:8px 0;text-align:right;font-weight:bold;font-size:13px;color:#172033;"
                                    th:text="${actionBy}">
                                    Manager
                                </td>
                            </tr>

                        </table>

                        <div
                                th:if="${rejectionReason != null and !rejectionReason.isBlank()}"
                                style="margin-top:22px;padding:15px 18px;background:#fef2f2;border-left:4px solid #dc2626;border-radius:8px;"
                        >
                            <p style="margin:0 0 5px;font-size:12px;font-weight:bold;color:#991b1b;">
                                Rejection Reason
                            </p>

                            <p style="margin:0;font-size:13px;line-height:1.6;color:#7f1d1d;"
                               th:text="${rejectionReason}">
                                Reason
                            </p>
                        </div>

                    </td>
                </tr>

                <tr>
                    <td style="padding:22px 40px;background:#f8fafc;border-top:1px solid #e5e7eb;text-align:center;">
                        <p style="margin:0;font-size:12px;color:#94a3b8;">
                            LeaveFlow · Leave Management
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
